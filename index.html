<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital 7 | Contabilidade &amp; Coworking Virtual</title>
  <meta name="description" content="Digital 7 Contabilidade &amp; Coworking Virtual. Escolha o seu segmento e fale com um especialista." />
  <meta name="theme-color" content="#0B2545" />

  <!-- Favicon (logotipo) -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512x512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="shortcut icon" href="assets/favicon-32x32.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />

  <link rel="canonical" href="https://digital7contabilidade.com.br/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Digital 7" />
  <meta property="og:url" content="https://digital7contabilidade.com.br/" />
  <meta property="og:title" content="Digital 7 | Contabilidade &amp; Coworking Virtual" />
  <meta property="og:description" content="Escolha o seu segmento e fale com um especialista da Digital 7." />
  <meta property="og:image" content="https://digital7contabilidade.com.br/assets/logotipo-digital-7.png" />
  <meta property="og:image:width" content="928" />
  <meta property="og:image:height" content="288" />
  <meta property="og:image:alt" content="Digital 7 — Contabilidade &amp; Coworking Virtual" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Digital 7 | Contabilidade &amp; Coworking Virtual" />
  <meta name="twitter:description" content="Escolha o seu segmento e fale com um especialista da Digital 7." />
  <meta name="twitter:image" content="https://digital7contabilidade.com.br/assets/logotipo-digital-7.png" />

  <style>
    :root {
      --navy-900: #0B2545;
      --navy-600: #1D4B7E;
      --gold-700: #A9761C;
      --gold-500: #C8962B;
      --gold-300: #E8C97A;
      --paper: #FFFFFF;
      --ink: #0B2545;
      --ink-soft: #5A6B80;
      --radius: 14px;
      --shadow-md: 0 10px 30px rgba(11, 37, 69, 0.08);
      --shadow-lg: 0 18px 45px rgba(11, 37, 69, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.75rem, 5vw, 3rem);
      padding: clamp(1.5rem, 5vw, 3.5rem) 1.25rem;
      background: radial-gradient(120% 90% at 50% 0%, #FFFFFF 0%, #F6F8FC 55%, #EDF1F8 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Filete dourado no topo */
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--navy-900) 0%, var(--gold-500) 50%, var(--navy-900) 100%);
      z-index: 2;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    .brand__logo {
      width: min(420px, 86vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(11, 37, 69, 0.1));
    }

    .rule {
      width: 72px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold-300), var(--gold-500), var(--gold-700));
    }

    .segments {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .segments li {
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    .segments li:nth-child(1) { animation-delay: 0.08s; }
    .segments li:nth-child(2) { animation-delay: 0.16s; }
    .segments li:nth-child(3) { animation-delay: 0.24s; }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 1.05rem 1.5rem;
      border: 1px solid rgba(11, 37, 69, 0.14);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--navy-900);
      font-family: inherit;
      font-size: clamp(0.98rem, 2.6vw, 1.08rem);
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .btn::after {
      content: "";
      position: absolute;
      left: 1.5rem;
      right: 1.5rem;
      bottom: -1px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold-300), var(--gold-500), var(--gold-700));
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease;
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(200, 150, 43, 0.55);
    }
    .btn:hover::after,
    .btn:focus-visible::after {
      transform: scaleX(1);
    }
    .btn:focus-visible {
      outline: 3px solid rgba(29, 75, 126, 0.45);
      outline-offset: 3px;
    }
    .btn:active {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .btn__arrow {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      stroke: var(--gold-700);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s ease;
    }
    .btn:hover .btn__arrow,
    .btn:focus-visible .btn__arrow {
      transform: translateX(4px);
    }
    .footer {
      font-size: 0.78rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) 0.32s both;
    }
    .footer p {
      margin: 0;
    }
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="brand">
    <img
      class="brand__logo"
      src="assets/logotipo-digital-7.png"
      alt="Digital 7 — Contabilidade &amp; Coworking Virtual"
      width="928"
      height="288"
      fetchpriority="high"
    />
    <span class="rule" aria-hidden="true"></span>
  </header>

  <main>
    <nav aria-label="Segmentos de atendimento">
      <ul class="segments">
        <li>
          <a class="btn" href="/mercado-digital">
            Contabilidade para Mercado Digital
            <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h13" />
              <path d="M12 5l7 7-7 7" />
            </svg>
          </a>
        </li>
        <li>
          <a class="btn" href="/medicos">
            Contabilidade para Médicos
            <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h13" />
              <path d="M12 5l7 7-7 7" />
            </svg>
          </a>
        </li>
        <li>
          <a class="btn" href="#dentistas">
            Contabilidade para Dentistas
            <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h13" />
              <path d="M12 5l7 7-7 7" />
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <footer class="footer">
    <p>&copy; <span id="ano">2026</span> Digital 7 — Contabilidade &amp; Coworking Virtual</p>
  </footer>

  <script>
    document.getElementById("ano").textContent = new Date().getFullYear();
  </script>
</body>
</html>
